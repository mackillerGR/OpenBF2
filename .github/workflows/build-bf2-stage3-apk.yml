name: Build Battlefield 2 Android Stage 3 APK

# This workflow uses only GitHub's STANDARD hosted Ubuntu runner.
# On PUBLIC repositories standard runners are free; no Railway or paid runners.
# Triggers only on a Stage 3 source-bundle upload to android-port (or manual dispatch).
on:
  push:
    branches:
      - android-port
    paths:
      - 'BF2_Stage3_Ready_For_APK_Build_mackillerGR.zip'
      - '.github/workflows/build-bf2-stage3-apk.yml'
      - 'android/stage3/patch_native_loader.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bf2-android-stage3
  cancel-in-progress: true

jobs:
  android-debug-apk:
    name: Stage 3 ARM64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout android-port
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify source ZIP and native libraries
        shell: bash
        run: |
          set -euo pipefail
          INPUT=BF2_Stage3_Ready_For_APK_Build_mackillerGR.zip
          test -s "$INPUT" || { echo "::error::Upload $INPUT to the android-port branch first."; exit 2; }
          unzip -t "$INPUT" | tail -1
          mkdir -p stage3
          unzip -q "$INPUT" -d stage3
          test -s stage3/gameapp/src/main/jniLibs/arm64-v8a/libmain.so
          test -s stage3/gameapp/src/main/jniLibs/arm64-v8a/libSDL3.so
          test -f stage3/gameapp/build.gradle
          test -f stage3/scripts/fetch_sdl_java.py
          echo "Stage 3 APK source and test13 ARM64 libraries are present."

      - name: Add folder picker and safer Android game-file import
        run: |
          python3 android/stage3/patch_folder_picker.py stage3
          # Bump version for the directory-picker fix. The debug signature may
          # differ between builds, so older test builds may need uninstalling.
          # Preserve the user's previous Stage 3 installation despite differently signed
          # ephemeral GitHub Actions debug keys: use a new application ID.
          sed -i "s/versionCode 3/versionCode 4/; s/versionName '0.3.0-dev'/versionName '0.3.1-folder-picker'/; s/applicationId 'com.mackillergr.bf2.stage3'/applicationId 'com.mackillergr.bf2.stage31'/" stage3/gameapp/build.gradle
          sed -i 's/Battlefield 2 LAN Stage 3 (dev)/Battlefield 2 LAN Stage 3.1/' stage3/gameapp/src/main/AndroidManifest.xml
          grep -q "GameDirectoryPicker" stage3/gameapp/src/main/java/com/mackillergr/bf2/LauncherActivity.java
          grep -q "applicationId 'com.mackillergr.bf2.stage31'" stage3/gameapp/build.gradle

      - name: Enable touchscreen mouse controls in Battlefield 2's menu
        shell: bash
        run: |
          set -euo pipefail
          python3 android/stage3/patch_touch_menu.py stage3 android/src/com/mackillergr/bf2/TouchOverlay.java
          # Debug signing uses a fresh key per workflow run; keep stage31 installed.
          sed -i "s/applicationId 'com.mackillergr.bf2.stage31'/applicationId 'com.mackillergr.bf2.stage32'/; s/versionCode 4/versionCode 5/; s/versionName '0.3.1-folder-picker'/versionName '0.3.2-touch-menu'/" stage3/gameapp/build.gradle
          sed -i 's/Battlefield 2 LAN Stage 3.1/Battlefield 2 LAN Stage 3.2/' stage3/gameapp/src/main/AndroidManifest.xml
          grep -q 'launch.putExtra("touch", true)' stage3/gameapp/src/main/java/com/mackillergr/bf2/LauncherActivity.java
          grep -q "new TouchOverlay(this)" stage3/gameapp/src/main/java/com/mackillergr/bf2/GameActivity.java
          test -s stage3/gameapp/src/main/java/com/mackillergr/bf2/TouchOverlay.java

      - name: Add Skip Intro touch control
        shell: bash
        run: |
          set -euo pipefail
          # Stage 3.2 copies the updated TouchOverlay.java from android-port.
          grep -q 'SKIP INTRO' stage3/gameapp/src/main/java/com/mackillergr/bf2/TouchOverlay.java
          grep -q 'KEYCODE_ESCAPE, true' stage3/gameapp/src/main/java/com/mackillergr/bf2/TouchOverlay.java
          # Separate debug package prevents the ephemeral signature from conflicting
          # with the user's already installed Stage 3.2.
          sed -i "s/applicationId 'com.mackillergr.bf2.stage32'/applicationId 'com.mackillergr.bf2.stage33'/; s/versionCode 5/versionCode 6/; s/versionName '0.3.2-touch-menu'/versionName '0.3.3-skip-intro'/" stage3/gameapp/build.gradle
          sed -i 's/Battlefield 2 LAN Stage 3.2/Battlefield 2 LAN Stage 3.3/' stage3/gameapp/src/main/AndroidManifest.xml
          grep -q "applicationId 'com.mackillergr.bf2.stage33'" stage3/gameapp/build.gradle

      - name: Diagnose native loader and defer optional libraries
        shell: bash
        run: |
          set -euo pipefail
          python3 android/stage3/patch_native_loader.py stage3
          sed -i "s/applicationId 'com.mackillergr.bf2.stage33'/applicationId 'com.mackillergr.bf2.stage34'/; s/versionCode 6/versionCode 7/; s/versionName '0.3.3-skip-intro'/versionName '0.3.4-native-loader-fix'/" stage3/gameapp/build.gradle
          sed -i 's/Battlefield 2 LAN Stage 3.3/Battlefield 2 LAN Stage 3.4/' stage3/gameapp/src/main/AndroidManifest.xml
          grep -Fq 'new String[] {"SDL3", "main"}' stage3/gameapp/src/main/java/com/mackillergr/bf2/GameActivity.java
          grep -Fq 'native_loader_failure.txt' stage3/gameapp/src/main/java/com/mackillergr/bf2/GameActivity.java
          grep -Fq "applicationId 'com.mackillergr.bf2.stage34'" stage3/gameapp/build.gradle

      - name: Fix intro overlay and add in-game / launcher log export (Stage 3.5)
        shell: bash
        run: |
          set -euo pipefail
          python3 android/stage3/patch_stage35.py stage3 android/stage3/BF2LogExporter.java
          sed -i "s/applicationId 'com.mackillergr.bf2.stage34'/applicationId 'com.mackillergr.bf2.stage35'/; s/versionCode 7/versionCode 8/; s/versionName '0.3.4-native-loader-fix'/versionName '0.3.5-intro-and-log'/" stage3/gameapp/build.gradle
          sed -i 's/Battlefield 2 LAN Stage 3.4/Battlefield 2 LAN Stage 3.5/' stage3/gameapp/src/main/AndroidManifest.xml
          grep -Fq "applicationId 'com.mackillergr.bf2.stage35'" stage3/gameapp/build.gradle
          grep -Fq 'if (introSkipVisible) drawSkipButton(c);' stage3/gameapp/src/main/java/com/mackillergr/bf2/TouchOverlay.java
          grep -Fq 'BF2LogExporter.request(this)' stage3/gameapp/src/main/java/com/mackillergr/bf2/LauncherActivity.java
          grep -Fq 'new TouchOverlay(this)' stage3/gameapp/src/main/java/com/mackillergr/bf2/GameActivity.java

      - name: Bypass startup movies in the native BF2 engine (Stage 3.6)
        shell: bash
        run: |
          set -euo pipefail
          # The BF2 Android native entry point has a fixed startup command string.
          # The +restart parser option sets skipMovies=true before intro playback.
          # Change only the exact test13 libmain.so constant without changing ELF length.
          python3 android/stage3/patch_stage36_skip_movies.py stage3
          sed -i "s/applicationId 'com.mackillergr.bf2.stage35'/applicationId 'com.mackillergr.bf2.stage36'/; s/versionCode 8/versionCode 9/; s/versionName '0.3.5-intro-and-log'/versionName '0.3.6-native-movie-skip'/" stage3/gameapp/build.gradle
          sed -i 's/Battlefield 2 LAN Stage 3.5/Battlefield 2 LAN Stage 3.6/' stage3/gameapp/src/main/AndroidManifest.xml
          grep -Fq "applicationId 'com.mackillergr.bf2.stage36'" stage3/gameapp/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          so = Path("stage3/gameapp/src/main/jniLibs/arm64-v8a/libmain.so").read_bytes()
          assert so.count(b"+modPath mods/bf2 +restart 1    +multi 1 +szx ") == 1
          assert b"+modPath mods/bf2 +fullscreen 0 +multi 1 +szx " not in so
          print("PASS native engine uses +restart 1 for skipMovies on all launches")
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default 'tools' package no longer exists in current SDK repositories.
          packages: platform-tools

      - name: Android SDK API 35 and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch verified SDL3 Android Java bridge
        run: python3 stage3/scripts/fetch_sdl_java.py

      - name: Run Stage 3 tests
        working-directory: stage3
        run: bash tests/run_stage3.sh

      - name: Compile and sign debug APK
        working-directory: stage3
        run: gradle :gameapp:assembleDebug --no-daemon --stacktrace

      - name: Verify APK and report checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=stage3/gameapp/build/outputs/apk/debug/gameapp-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -m1 "^package: name='com.mackillergr.bf2.stage36'"
          unzip -l "$APK" | grep -E 'classes.dex|lib/arm64-v8a/libmain.so|lib/arm64-v8a/libSDL3.so'
          sha256sum "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Battlefield2_Android_Stage36_NativeSkipMovies_APK
          path: stage3/gameapp/build/outputs/apk/debug/gameapp-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
